specialização","Maestria"]},{"name":"Curandeiro","area":"Saúde","color":"#79d5c9","ai":5,"i":1,"requirements":["Cuidador Iniciante","Coletor de Ervas"],"skills":["Fundamentos","Ferramentas","Técnicas","Eficiência","Especialização","Maestria"]},{"name":"Curandeiro Animal","area":"Saúde","color":"#79d5c9","ai":5,"i":2,"requirements":["Cuidador Iniciante","Criador de Animais"],"skills":["Fundamentos","Ferramentas","Técnicas","Eficiência","Especialização","Maestria"]},{"name":"Mecânico","area":"Engenharia","color":"#8bb5f2","ai":6,"i":0,"requirements":["Ferreiro","Carpinteiro"],"skills":["Fundamentos","Ferramentas","Técnicas","Eficiência","Especialização","Maestria"]},{"name":"Metalurgista","area":"Engenharia","color":"#8bb5f2","ai":6,"i":1,"requirements":["Mineiro","Ferreiro"],"skills":["Fundamentos","Ferramentas","Técnicas","Eficiência","Especialização","Maestria"]},{"name":"Projetista","area":"Engenharia","color":"#8bb5f2","ai":6,"i":2,"requirements":["Desenhista","Ferreiro"],"skills":["Leitura técnica","Desenho técnico","Projeto mecânico","Projeto estrutural","Projeto naval","Projeto industrial"]},{"name":"Engenheiro","area":"Engenharia","color":"#8bb5f2","ai":6,"i":3,"requirements":["Mecânico","Projetista"],"skills":["Fundamentos de engenharia","Metalurgia","Engenharia mecânica","Engenharia civil","Engenharia naval","Engenharia industrial"]},{"name":"Guarda","area":"Defesa","color":"#e18d9b","ai":7,"i":0,"requirements":[],"skills":["Fundamentos","Ferramentas","Técnicas","Eficiência","Especialização","Maestria"]},{"name":"Pesquisador","area":"Conhecimento","color":"#b6a1f2","ai":8,"i":0,"requirements":["Escritor","Desenhista"],"skills":["Fundamentos","Ferramentas","Técnicas","Eficiência","Especialização","Maestria"]},{"name":"Jornalista","area":"Conhecimento","color":"#b6a1f2","ai":8,"i":1,"requirements":["Escritor","Pesquisador"],"skills":["Fundamentos","Ferramentas","Técnicas","Eficiência","Especialização","Maestria"]},{"name":"Domador","area":"Fauna e natureza","color":"#a3d98a","ai":9,"i":0,"requirements":["Criador de Animais","Caçador"],"skills":["Aproximação","Vínculo animal","Treinamento","Comandos","Montaria","Monstros"]}];const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,zoom=.58,panX=0,panY=0,selected=null;const touch=new Map();let drag=false,moved=false,last=null,pinch=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}new ResizeObserver(resize).observe(canvas);
const radii=[130,220,315,410,515,610,705,800,895,990];const pts=CATALOG.map(p=>{const same=CATALOG.filter(q=>q.ai===p.ai);const idx=same.findIndex(q=>q.name===p.name);const theta=(idx/same.length)*Math.PI*2+p.ai*.34-.8;return {...p,x:Math.cos(theta)*radii[p.ai],y:Math.sin(theta)*radii[p.ai]};});
function screen(x,y){return [w/2+panX+x*zoom,h/2+panY+y*zoom]}function world(x,y){return [(x-w/2-panX)/zoom,(y-h/2-panY)/zoom]}
function orb(x,y,r,color){const g=ctx.createRadialGradient(x-r*.34,y-r*.37,r*.07,x,y,r);g.addColorStop(0,'#fff5cf');g.addColorStop(.16,color);g.addColorStop(.75,color);g.addColorStop(1,'#172341');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='#ffffff55';ctx.lineWidth=1.4;ctx.stroke();ctx.fillStyle='#ffffff22';ctx.beginPath();ctx.ellipse(x-r*.2,y+r*.13,r*.55,r*.14,-.4,0,7);ctx.fill()}
function draw(){ctx.clearRect(0,0,w,h);const [cx,cy]=screen(0,0);ctx.save();ctx.translate(cx,cy);ctx.scale(zoom,zoom);for(let i=0;i<radii.length;i++){ctx.beginPath();ctx.arc(0,0,radii[i],0,7);ctx.strokeStyle=CATALOG.find(p=>p.ai===i)?.color+'66';ctx.lineWidth=2/zoom;ctx.stroke()}ctx.restore();orb(cx,cy,Math.max(16,25*zoom),'#ffbe4b');ctx.fillStyle='#fff2d4';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('PERSONAGEM',cx,cy+Math.max(16,25*zoom)+15);
for(const p of pts){const [x,y]=screen(p.x,p.y);if(x<-100||y<-100||x>w+100||y>h+100)continue;const r=Math.max(8,19*zoom);orb(x,y,r,p.color);if(zoom>.24){ctx.fillStyle='#fff5df';ctx.font='bold '+Math.max(10,Math.min(14,12*zoom+5))+'px system-ui';ctx.textAlign='center';ctx.fillText(p.name,x,y+r+14)}if(zoom>.4||selected?.name===p.name){for(let j=0;j<p.skills.length;j++){const a=j*Math.PI*2/p.skills.length-.9,rr=r+Math.max(11,19*zoom),mx=x+Math.cos(a)*rr,my=y+Math.sin(a)*rr;ctx.strokeStyle=p.color+'88';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(mx,my);ctx.stroke();orb(mx,my,Math.max(3,5*zoom),p.color)}}}
}
function focus(p){selected=p;zoom=Math.max(1.5,zoom);panX=-p.x*zoom;panY=-p.y*zoom;draw();document.getElementById('details').style.display='block';document.getElementById('dn').textContent='🪐 '+p.name;document.getElementById('da').innerHTML='<span class="pill">'+p.area+'</span>';document.getElementById('dr').textContent=p.requirements.length?'Requisitos propostos: '+p.requirements.join(' + ')+' (Profissional 10 em cada).':'Profissão básica ou requisitos ainda em definição.';document.getElementById('ds').innerHTML=p.skills.map((s,i)=>'<span class="pill">🌙 '+(i+1)+'. '+s+'</span>').join('')}
function hit(x,y){let best=null,d=Infinity;for(const p of pts){const [sx,sy]=screen(p.x,p.y);const dd=Math.hypot(sx-x,sy-y);if(dd<Math.max(19,22*zoom)&&dd<d){best=p;d=dd}}return best}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touch.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY];drag=true;moved=false;if(touch.size===2){const a=[...touch.values()];pinch={dist:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),zoom,panX,panY,mid:[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]}}});
canvas.addEventListener('pointermove',e=>{if(!touch.has(e.pointerId))return;touch.set(e.pointerId,[e.clientX,e.clientY]);if(touch.size===2&&pinch){const a=[...touch.values()],mid=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);const nz=Math.max(.2,Math.min(4,pinch.zoom*dist/Math.max(1,pinch.dist)));panX=pinch.panX+(mid[0]-pinch.mid[0])+(pinch.mid[0]-w/2-pinch.panX)*(1-nz/pinch.zoom);panY=pinch.panY+(mid[1]-pinch.mid[1])+(pinch.mid[1]-h/2-pinch.panY)*(1-nz/pinch.zoom);zoom=nz;moved=true}else if(last){panX+=e.clientX-last[0];panY+=e.clientY-last[1];if(Math.hypot(e.clientX-last[0],e.clientY-last[1])>2)moved=true;last=[e.clientX,e.clientY]}draw()});
canvas.addEventListener('pointerup',e=>{touch.delete(e.pointerId);if(!moved&&touch.size===0){const r=canvas.getBoundingClientRect(),p=hit(e.clientX-r.left,e.clientY-r.top);if(p)focus(p)}if(touch.size<2)pinch=null;last=null});canvas.addEventListener('pointercancel',e=>{touch.delete(e.pointerId);pinch=null;last=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.2,Math.min(4,zoom*(e.deltaY>0?.88:1.12)));draw()},{passive:false});document.getElementById('plus').onclick=()=>{zoom=Math.min(4,zoom*1.3);draw()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.2,zoom/1.3);draw()};document.getElementById('reset').onclick=()=>{zoom=.58;panX=panY=0;selected=null;document.getElementById('details').style.display='none';draw()};document.getElementById('close').onclick=()=>document.getElementById('details').style.display='none';document.getElementById('search').oninput=e=>{const q=e.target.value.toLocaleLowerCase('pt-BR');const list=document.getElementById('list');list.replaceChildren();if(!q)return;pts.filter(p=>p.name.toLocaleLowerCase('pt-BR').includes(q)).slice(0,12).forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.onclick=()=>{focus(p);list.replaceChildren()};list.append(b)})};resize();
