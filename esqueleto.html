<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório do Esqueleto | Crônicas dos Pioneiros</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1520;color:#e7f0ef;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}
header{position:fixed;top:0;left:0;right:0;z-index:2;padding:12px 14px;background:#102230e8;display:flex;justify-content:space-between;align-items:center;gap:8px}header b{font-size:15px}a{color:#d6dff3;text-decoration:none}small{color:#b2c8d0}
.panel{position:fixed;z-index:2;bottom:10px;left:10px;right:10px;background:#112533ef;border:1px solid #466474;border-radius:14px;padding:12px;display:grid;gap:9px;max-width:620px;margin:auto;box-shadow:0 6px 28px #0009}
.actions{display:flex;gap:6px;flex-wrap:wrap}button,select{background:#294959;color:#f4faf7;border:1px solid #6a8995;border-radius:8px;padding:9px;font-weight:600}button.active{background:#d5a95b;color:#17232b}select{flex:1;min-width:125px}label{display:flex;align-items:center;gap:10px}input[type=range]{flex:1;min-width:80px;accent-color:#f2bd6c}#status{font-size:12px;color:#d0e5ec}#legend{font-size:12px;color:#b5d3d9}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b1520;z-index:5;text-align:center;padding:20px}.loading[hidden]{display:none}
</style></head><body><div id="loading" class="loading">Carregando esqueleto original do pioneiro...</div><header><div><b>🦴 Laboratório do Esqueleto</b><div><small>Gire com o dedo • pinça para aproximar</small></div></div><a href="/tour3d.html">← Vila</a></header>
<div class="panel"><div class="actions"><button id="body">👤 Corpo: sim</button><button id="bones" class="active">🦴 Ossos: sim</button><button id="axes" class="active">↪ Eixos: sim</button><button id="front">Frente</button><button id="side">Lado</button><button id="reset">Zerar</button></div>
<label>Articulação <select id="joint"><option value="L_Calf">Joelho esquerdo</option><option value="R_Calf">Joelho direito</option><option value="L_Thigh">Quadril esquerdo</option><option value="R_Thigh">Quadril direito</option><option value="L_Upperarm">Ombro esquerdo</option><option value="R_Upperarm">Ombro direito</option><option value="L_Forearm">Cotovelo esquerdo</option><option value="R_Forearm">Cotovelo direito</option></select></label>
<label id="axisRow">Eixo <select id="axis"><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select></label><label>Rotação <input id="angle" type="range" min="-100" max="100" step="1" value="0"><strong id="degrees">0°</strong></label>
<div id="legend"><span class="dot" style="background:#22d9fa"></span>Coxas <span class="dot" style="background:#ff9b35"></span>Joelhos <span class="dot" style="background:#58ed8b"></span>Braços • Seta amarela: eixo de rotação da articulação selecionada</div>
<div id="status">Carregando...</div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.161.0';
import {OrbitControls} from 'https://esm.sh/three@0.161.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://esm.sh/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#101b29');
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f6ff,0x4a4d65,2.3));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(3,6,5);scene.add(key);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=1.5;controls.maxDistance=15;
let model=null,helper=null,rig={},arrows=[],showBody=true,showBones=true,showAxes=true,height=3,centerY=1.5;
const $=id=>document.getElementById(id);
function view(side=false){camera.position.set(side?4.9:0,centerY+0.25,side?0:5.8);controls.target.set(0,centerY,0);controls.update()}view();
function refresh(){if(model)model.traverse(o=>{if(o.isMesh)o.visible=showBody});if(helper)helper.visible=showBones;for(const a of arrows)a.visible=showAxes;const current=rig[$('joint').value];if(current){$('status').textContent='Osso: '+$('joint').value+' • eixo '+($('joint').value.includes('Upperarm')?$('axis').value.toUpperCase():'X')+' • ajuste o ângulo e observe a dobra. O sinal positivo/negativo indica o sentido.'}else $('status').textContent='Este osso não foi encontrado no arquivo.'}
function updateAngle(){const degrees=Number($('angle').value);$('degrees').textContent=degrees+'°';for(const item of Object.values(rig))item.bone.quaternion.copy(item.rest);const item=rig[$('joint').value];if(item)item.bone.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(item.axes[$('axis').value]||item.axis,THREE.MathUtils.degToRad(degrees)));refresh()}
function setToggle(id,prop){$(id).onclick=()=>{if(id==='body')showBody=!showBody;else if(id==='bones')showBones=!showBones;else showAxes=!showAxes;$(id).classList.toggle('active',id==='body'?showBody:id==='bones'?showBones:showAxes);$(id).textContent=id==='body'?'👤 Corpo: '+(showBody?'sim':'não'):id==='bones'?'🦴 Ossos: '+(showBones?'sim':'não'):'↪ Eixos: '+(showAxes?'sim':'não');refresh()}}
['body','bones','axes'].forEach(id=>setToggle(id));$('body').classList.add('active');
function updateAxisUI(){const name=$('joint').value;const shoulder=name.includes('Upperarm');$('axisRow').style.display=shoulder?'flex':'none';$('axis').value=shoulder?'z':'x';$('angle').value=0;updateAngle()}$('joint').onchange=updateAxisUI;$('axis').onchange=updateAngle;$('angle').oninput=updateAngle;$('front').onclick=()=>view(false);$('side').onclick=()=>view(true);$('reset').onclick=()=>{$('angle').value=0;updateAngle();view()};
new GLTFLoader().load('/tripo_convert_16d597ae-88d9-4998-903d-45cfb918c602.glb',gltf=>{
model=gltf.scene;scene.add(model);model.traverse(o=>{if(o.isMesh&&o.material)o.material.side=THREE.DoubleSide});
const bounds=new THREE.Box3().setFromObject(model),sz=bounds.getSize(new THREE.Vector3()),c=bounds.getCenter(new THREE.Vector3());if(sz.y>0){const scale=3/sz.y;model.scale.setScalar(scale);model.position.set(-c.x*scale,-bounds.min.y*scale,-c.z*scale)}model.updateWorldMatrix(true,true);
const b=new THREE.Box3().setFromObject(model);height=b.getSize(new THREE.Vector3()).y;centerY=height/2;view();
helper=new THREE.SkeletonHelper(model);helper.material.depthTest=false;helper.material.transparent=true;helper.material.opacity=1;helper.renderOrder=20;scene.add(helper);
const names=['L_Thigh','R_Thigh','L_Calf','R_Calf','L_Upperarm','R_Upperarm','L_Forearm','R_Forearm'];
for(const name of names){const bone=model.getObjectByName(name);if(!bone)continue;const inv=bone.getWorldQuaternion(new THREE.Quaternion()).invert();const axes={x:new THREE.Vector3(1,0,0).applyQuaternion(inv).normalize(),y:new THREE.Vector3(0,1,0).applyQuaternion(inv).normalize(),z:new THREE.Vector3(0,0,1).applyQuaternion(inv).normalize()};const axis=axes[name.includes('Upperarm')?'z':'x'];rig[name]={bone,rest:bone.quaternion.clone(),axis,axes};const color=name.includes('Calf')?0xff9b35:name.includes('Thigh')?0x22d9fa:0x58ed8b;const arrow=new THREE.ArrowHelper(new THREE.Vector3(0,0,1),new THREE.Vector3(),.45,color,.13,.065);arrow.renderOrder=25;scene.add(arrow);arrows.push(arrow);arrow.userData.name=name}
$('loading').hidden=true;updateAxisUI();},undefined,err=>{$('loading').textContent='Falha ao carregar GLB: '+err.message;console.error(err)});
function animate(){requestAnimationFrame(animate);controls.update();if(model){model.updateWorldMatrix(true,true);for(const arrow of arrows){const item=rig[arrow.userData.name];if(!item)continue;arrow.position.copy(item.bone.getWorldPosition(new THREE.Vector3()));arrow.setDirection((item.axes[arrow.userData.name===$('joint').value?$('axis').value:(arrow.userData.name.includes('Upperarm')?'z':'x')]||item.axis).clone().applyQuaternion(item.bone.getWorldQuaternion(new THREE.Quaternion())).normalize());arrow.setColor(new THREE.Color(arrow.userData.name===$('joint').value?0xffee33:arrow.userData.name.includes('Calf')?0xff9b35:arrow.userData.name.includes('Thigh')?0x22d9fa:0x58ed8b))}}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
