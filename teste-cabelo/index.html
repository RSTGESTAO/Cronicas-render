<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crônicas dos Pioneiros · Teste de cabelo</title><style>body{margin:0;background:#111827;color:white;font:14px system-ui}canvas{display:block}#ui{position:fixed;top:10px;left:10px;background:#171d2be8;padding:12px;border-radius:12px;max-width:280px;max-height:90vh;overflow:auto}label{display:block;margin:8px 0}input[type=range]{width:100%}button{padding:8px;border-radius:8px;border:0;margin:3px;background:#c99b57;color:#111}small{color:#bbc}#status{font-size:12px;color:#e6c789}</style><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.170.0","three/addons/":"https://esm.sh/three@0.170.0/examples/jsm/"}}</script></head><body><div id="ui"><b>🧑‍🚀 Pioneiro · Encaixe do cabelo</b><div id="status">Carregando...</div><label>Escala <span id="vs">0.35</span><input id="s" type="range" min="0.1" max="1" step="0.005" value="0.35"></label><label>Altura Y <span id="vy">0.7</span><input id="y" type="range" min="0" max="1.5" step="0.005" value="0.7"></label><label>Horizontal X <span id="vx">0</span><input id="x" type="range" min="-0.5" max="0.5" step="0.005" value="0"></label><label>Profundidade Z <span id="vz">0</span><input id="z" type="range" min="-0.5" max="0.5" step="0.005" value="0"></label><label>Rotação Y <span id="vr">0</span><input id="r" type="range" min="-180" max="180" step="1" value="0"></label><button id="copy">Copiar ajustes</button><button id="toggle">Ocultar cabelo</button><p><small>Arraste para girar. Pinça para aproximar. Os controles alteram apenas o cabelo.</small></p></div><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color('#252b38');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);camera.position.set(0,.7,2.3);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x7788aa,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,3,4);scene.add(light);const ctl=new OrbitControls(camera,renderer.domElement);ctl.target.set(0,.5,0);ctl.update();const loader=new GLTFLoader();let hair;const status=document.querySelector('#status');try{const [a,b]=await Promise.all([loader.loadAsync('./corpo.glb'),loader.loadAsync('./cabelo.glb')]);scene.add(a.scene);hair=b.scene;scene.add(hair);status.textContent='Corpo e cabelo carregados ✓';update()}catch(e){status.textContent='Erro ao carregar GLB: '+e.message}const ids=['s','x','y','z','r'];function update(){if(!hair)return;const v=id=>Number(document.getElementById(id).value);hair.scale.setScalar(v('s'));hair.position.set(v('x'),v('y'),v('z'));hair.rotation.y=v('r')*Math.PI/180;ids.forEach(id=>document.getElementById('v'+id).textContent=v(id).toFixed(id==='r'?0:3))}ids.forEach(id=>document.getElementById(id).addEventListener('input',update));document.getElementById('toggle').onclick=()=>{if(hair)hair.visible=!hair.visible};document.getElementById('copy').onclick=()=>{const result=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));navigator.clipboard?.writeText(JSON.stringify(result));alert(JSON.stringify(result))};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{ctl.update();renderer.render(scene,camera)})</script></body></html>
