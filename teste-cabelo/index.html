<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crônicas dos Pioneiros · Encaixe do cabelo</title><style>body{margin:0;background:#171b26;color:#fff;font:14px system-ui}#ui{position:fixed;top:12px;left:12px;z-index:2;background:#192132ed;padding:14px;border-radius:12px;max-width:270px;max-height:85vh;overflow:auto}label{display:block;margin:8px 0}input{width:100%}button{margin:4px;padding:8px;border:0;border-radius:7px;background:#e8b675;color:#222}</style><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.170.0","three/addons/":"https://esm.sh/three@0.170.0/examples/jsm/"}}</script></head><body><div id="ui"><b>🎮 Teste de encaixe do cabelo</b><p id="status">Carregando GLBs...</p><label>Escala <span id="vs"></span><input id="s" type="range" min=".05" max="1" step=".005" value=".35"></label><label>Altura Y <span id="vy"></span><input id="y" type="range" min="0" max="1.5" step=".005" value=".7"></label><label>Horizontal X <span id="vx"></span><input id="x" type="range" min="-.5" max=".5" step=".005" value="0"></label><label>Profundidade Z <span id="vz"></span><input id="z" type="range" min="-.5" max=".5" step=".005" value="0"></label><label>Rotação Y <span id="vr"></span><input id="r" type="range" min="-180" max="180" step="1" value="0"></label><button id="copy">Copiar ajustes</button><button id="toggle">Ocultar cabelo</button><p>Arraste para girar e faça pinça para ampliar.</p></div><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color('#242a36');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);camera.position.set(0,.65,2.3);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x7889aa,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,3,4);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.5,0);controls.update();let hair;const ids=['s','x','y','z','r'];function update(){if(!hair)return;const v=id=>+document.getElementById(id).value;hair.scale.setScalar(v('s'));hair.position.set(v('x'),v('y'),v('z'));hair.rotation.y=v('r')*Math.PI/180;ids.forEach(id=>document.getElementById('v'+id).textContent=v(id).toFixed(id==='r'?0:3))}ids.forEach(id=>document.getElementById(id).addEventListener('input',update));document.getElementById('toggle').onclick=()=>{if(hair)hair.visible=!hair.visible};document.getElementById('copy').onclick=()=>{const result=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));navigator.clipboard?.writeText(JSON.stringify(result));alert(JSON.stringify(result))};try{const loader=new GLTFLoader();const [body,wig]=await Promise.all([loader.loadAsync('./corpo.glb'),loader.loadAsync('./cabelo.glb')]);scene.add(body.scene);hair=wig.scene;scene.add(hair);update();document.getElementById('status').textContent='Modelos carregados ✓'}catch(e){document.getElementById('status').textContent='Faltam os arquivos corpo.glb e cabelo.glb nesta pasta. '+e.message}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)})</script></body></html>
