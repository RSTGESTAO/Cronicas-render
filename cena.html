<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crônicas dos Pioneiros - A Vila Esquecida</title><style>body{margin:0;background:#111;color:white;font:16px system-ui}canvas{display:block}#title{position:absolute;top:4%;left:6%;font-weight:900;text-shadow:0 2px 5px #333}#caption{position:absolute;bottom:6%;left:5%;right:5%;text-align:center;font-weight:700;text-shadow:0 2px 5px #333}</style><div id="title">CRÔNICAS DOS PIONEIROS</div><div id="caption">A Vila Esquecida</div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const s=new T.Scene();s.background=new T.Color(0x9ed9ee);s.fog=new T.Fog(0x9ed9ee,22,55);const c=new T.PerspectiveCamera(42,9/16,.1,90);const r=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(1);document.body.appendChild(r.domElement);s.add(new T.HemisphereLight(0xffe9c7,0x4e6855,2.2));const sun=new T.DirectionalLight(0xffdca6,2.4);sun.position.set(-8,15,10);s.add(sun);
const m=x=>new T.MeshLambertMaterial({color:x});const grass=m(0x78b45b),road=m(0xcbb08a),stone=m(0x979c91),wood=m(0x9a6a49),roof=m(0xb6654b),leaf=m(0x4b9452),skin=m(0xf5c496),hair=m(0x60402c),shirt=m(0x4483a1),pants=m(0x514b46),dark=m(0x302e2c);
function obj(geo,mat,x,y,z,parent=s){let a=new T.Mesh(geo,mat);a.position.set(x,y,z);parent.add(a);return a}function box(w,h,d,mat,x,y,z,p){return obj(new T.BoxGeometry(w,h,d),mat,x,y,z,p)}function sphere(rad,mat,x,y,z,p){return obj(new T.SphereGeometry(rad,10,8),mat,x,y,z,p)}function cylinder(a,b,h,mat,x,y,z,p){return obj(new T.CylinderGeometry(a,b,h,9),mat,x,y,z,p)}
box(80,.2,80,grass,0,-.1,0);box(4,.03,35,road,0,.01,2);
function house(x,z){const g=new T.Group();g.position.set(x,0,z);s.add(g);box(3,2.2,3,wood,0,1.1,0,g);let top=box(3.7,.5,3.6,roof,0,2.5,0,g);top.rotation.z=.13;box(.75,1.4,.12,dark,0,.7,1.56,g);box(.8,.5,.8,stone,1.7,.3,1.8,g)}house(-4,-5);house(4,-6);house(-5,3);house(5,3);
cylinder(.8,.95,1.1,stone,1,.55,-1);cylinder(.45,.45,.05,dark,1,1.12,-1);
for(let i=0;i<35;i++){let x=Math.sin(i*5.2)*16,z=Math.cos(i*3.9)*15;if(Math.abs(x)<7&&Math.abs(z)<8)continue;cylinder(.19,.25,1.9,wood,x,.95,z);sphere(1.3,leaf,x,2.4,z)}
for(let i=0;i<14;i++){let x=Math.sin(i*9.1)*8,z=Math.cos(i*6.1)*9;if(Math.abs(x)<2)continue;box(.55,.25,.6,stone,x,.12,z)}
const hero=new T.Group();s.add(hero);box(.85,1,.5,shirt,0,1.05,0,hero);sphere(.62,skin,0,1.95,0,hero);let cap=sphere(.64,hair,0,2.28,-.1,hero);cap.scale.y=.48;for(let sign of [-1,1]){sphere(.08,dark,sign*.24,2,.56,hero);box(.24,.75,.27,skin,sign*.56,1.05,0,hero);box(.3,.7,.34,pants,sign*.22,.35,0,hero)}
window.drawFrame=(t)=>{t=Math.max(0,Math.min(12,t));hero.position.set(0,t<7?Math.abs(Math.sin(t*9))*.065:0,9-Math.min(t,7)*1.2);hero.rotation.y=Math.PI;c.position.set(13+Math.sin(t/12)*2,13,22-t*.38);c.lookAt(0,1.1,0);document.querySelector('#caption').textContent=t<4?'Um viajante encontra a antiga vila...':t<8?'As ruínas aguardam novos habitantes.':'População: 1 · Sua história começa aqui';r.render(s,c);return true};window.drawFrame(0);window.__ready=true;
</script>
