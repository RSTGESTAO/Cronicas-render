else{pioneer.position.set(96,0,-45);controls.target.set(96,1.5,-45);camera.position.set(104,8,-27);document.getElementById('msg').textContent={walk:'Teste de caminhada',run:'Teste de corrida',pickup:'Teste de pegar objeto'}[mode]}controls.update()}

function animatePioneer(t){const elapsed=Math.max(0,t-actionStart),isMoving=action==='walk'||action==='run'||action==='arrival',speed=action==='run'?4.8:action==='walk'?1.7:3.2;
let phase=elapsed*(action==='run'?13:8);
if(action==='arrival'){const progress=Math.min(1,elapsed/actionDuration),smooth=progress*progress*(3-2*progress);pioneer.position.x=147+(64-147)*smooth;pioneer.position.z=-45+Math.sin(progress*Math.PI)*2;if(progress>=1){action='idle';arrivalActive=false;document.getElementById('msg').textContent='O primeiro pioneiro chegou ao Poço Ancestral'}}
else if(action==='walk'||action==='run'){const distance=(elapsed*speed)%40;pioneer.position.x=96-distance;pioneer.position.z=-45}
else if(action==='pickup'&&elapsed>3.6){action='idle';document.getElementById('msg').textContent='Objeto recolhido • animação concluída'}
const picking=action==='pickup',pickProgress=picking?Math.min(1,elapsed/3.6):0,pickWeight=picking?Math.sin(pickProgress*Math.PI)**2:0;
pose(t,action,phase);
if(picking&&boneRig){bend('L_Thigh',pickWeight*.7);bend('R_Thigh',pickWeight*.7);bend('L_Calf',Math.min(THREE_KNEE_MAX,pickWeight*.95));bend('R_Calf',Math.min(THREE_KNEE_MAX,pickWeight*.95));bend('Spine01',pickWeight*.65);bend('Spine02',pickWeight*.2);bend('L_Upperarm',-pickWeight*.95);bend('R_Upperarm',-pickWeight*.95);bend('L_Forearm',-pickWeight*.9);bend('R_Forearm',-pickWeight*.9)}
pioneer.rotation.y=-Math.PI/2;pioneer.position.y=isMoving?Math.abs(Math.sin(phase))*(action==='run'?.14:.065):0;
const swing=isMoving?Math.sin(phase)*.5:0;arms[0].rotation.x=detailedPioneer?0:swing;arms[1].rotation.x=detailedPioneer?0:-swing;legs[0].rotation.x=detailedPioneer?0:-swing;legs[1].rotation.x=detailedPioneer?0:swing;
}

const targets={well:[55,-45,45],church:[-70,-135,48],hall:[65,-135,58],wide:[25,-30,260]};let focus='well',tour=true,showNames=true,clock=new T.Clock();function goto(key){focus=key;tour=false;document.getElementById('tour').classList.remove('active');const [x,z,dist]=targets[key];controls.target.set(x,0,z);camera.position.set(x+dist*.9,dist*.8,z+dist);controls.update();document.getElementById('msg').textContent=key==='well'?'Poço ancestral • lote LH-bd45 • 10 × 10 m':key==='church'?'Igreja • 20 × 10 m':key==='hall'?'Prefeitura • 30 × 10 m':'Setor LH • Vila Inicial'}for(const key of Object.keys(targets))document.getElementById(key).onclick=()=>goto(key);document.getElementById('tour').onclick=()=>{tour=!tour;document.getElementById('tour').classList.toggle('active',tour)};document.getElementById('labels').onclick=e=>{showNames=!showNames;e.target.textContent='Nomes: '+(showNames?'sim':'não');document.getElementById('msg').hidden=!showNames};
