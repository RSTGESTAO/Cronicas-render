<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tour 3D | Crônicas dos Pioneiros</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#9bc2c5;color:#f7e8c5;font:14px system-ui}canvas{display:block;touch-action:none}.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2;gap:10px}.top>*,.bar{background:#122b36ed;border:1px solid #c4a46b;border-radius:12px;padding:12px;box-shadow:0 5px 25px #0005}.top b{font:19px Georgia}.top small{display:block;color:#c2d1c8}.top a{color:#f7e8c5;text-decoration:none;align-self:start}.bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100% - 16px);overflow:auto;z-index:2}button{border:1px solid #8c986d;background:#35594f;color:#fff3db;border-radius:8px;padding:10px;white-space:nowrap;font-weight:700;cursor:pointer}button.active{background:#c8a35d;color:#142e30}#msg{position:fixed;bottom:88px;left:12px;background:#122b36e8;padding:8px;border-radius:8px;font-size:12px}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#122b36;z-index:5}#loading[hidden]{display:none}</style></head><body><div id="loading">Construindo a Vila Inicial em 3D...</div><div class="top"><div><b>✦ Crônicas dos Pioneiros</b><small>Setor LH • Tour aéreo cinematográfico</small></div><a href="/vila.html">← Mapa 2D</a></div><div id="msg">Arraste para girar • pinça para aproximar • toque nas construções</div><div class="bar"><button id="tour" class="active">▶ Tour</button><button id="well">Poço</button><button id="church">Igreja</button><button id="hall">Prefeitura</button><button id="wide">Vista geral</button><button id="labels">Nomes: sim</button></div><script type="module">
import * as T from 'https://esm.sh/three@0.161.0';
import {OrbitControls} from 'https://esm.sh/three@0.161.0/examples/jsm/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#a4c8d0');scene.fog=new T.FogExp2('#a4c8d0',.0015);const camera=new T.PerspectiveCamera(47,innerWidth/innerHeight,.5,2000);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xf5ffe8,0x506c54,2.1));const sun=new T.DirectionalLight(0xffdf9e,3);sun.position.set(-120,250,140);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-350,right:350,top:350,bottom:-350});scene.add(sun);
const m=c=>new T.MeshStandardMaterial({color:c,roughness:.91}),grass=m(0x8caa70),dirt=m(0xa48a64),stone=m(0xb6a58d),dark=m(0x777167),wood=m(0x76563d),roof=m(0x985746),leaves=[m(0x356e47),m(0x528a4d),m(0x6a9e55)],blue=new T.MeshStandardMaterial({color:0x4ba6bd,roughness:.22,metalness:.12});const rng=n=>{let v=Math.sin(n*127.1+31.4)*43758.5453;return v-Math.floor(v)};
function box(w,h,d,mat,x,y,z,parent=scene){let o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(rt,rb,h,mat,x,y,z,parent=scene,n=10){let o=new T.Mesh(new T.CylinderGeometry(rt,rb,h,n),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const ground=new T.Mesh(new T.PlaneGeometry(1050,1050),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roads=[[[55,-45],[55,-205]],[[55,-45],[220,-45]],[[55,-45],[55,210]],[[55,-45],[-195,-45]],[[55,-105],[-70,-105]],[[55,-105],[80,-105]]];for(const road of roads){for(let j=1;j<road.length;j++){const [x,z]=road[j-1],[xx,zz]=road[j],dx=xx-x,dz=zz-z,o=box(5,.08,Math.hypot(dx,dz),dirt,(x+xx)/2,.05,(z+zz)/2);o.rotation.y=Math.atan2(dx,dz)}}
cyl(13,13,.15,m(0xc4aa7b),55,.09,-45);
const well=new T.Group();well.position.set(55,0,-45);scene.add(well);cyl(3.2,3.4,1.5,stone,0,.8,0,well,14);cyl(2.5,2.5,.08,blue,0,1.6,0,well,14);for(let i=0;i<12;i++){const a=i*Math.PI/6,o=box(1.6,.4,.75,dark,Math.sin(a)*3.1,1.55,Math.cos(a)*3.1,well);o.rotation.y=a}for(const z of [-2.6,2.6])cyl(.2,.2,4.4,wood,0,3.6,z,well);box(.5,.6,6,wood,0,5.5,0,well);
const buildings=[{id:'church',name:'Igreja em ruínas',kind:'church',x:420,y:360,w:20,h:10},{id:'hall',name:'Prefeitura em ruínas',kind:'hall',x:550,y:360,w:30,h:10},...[[340,410],[370,450],[350,530],[400,580],[470,620],[550,600],[620,550],[630,460],[650,400],[480,320]].map(([x,y],i)=>({id:'house'+i,name:'Casa em ruínas '+(i+1),kind:'house',x,y,w:10,h:10}))];const pick=[];
function ruin(b,i){const g=new T.Group();g.position.set(b.x+b.w/2-500,0,b.y+b.h/2-500);g.userData=b;scene.add(g);pick.push(g);const w=b.w,d=b.h,h=b.kind==='hall'?8:b.kind==='church'?7:4.4;box(w,.35,d,dark,0,.2,0,g);for(const side of [-1,1]){const front=side===1;for(let k=0;k<4;k++){const ww=w/4-.12,hh=h*(.43+.55*rng(i*51+k*11+(front?4:0)));box(ww,hh,.7,stone,-w/2+ww*(k+.5)+k*.12,hh/2,side*d/2,g);if(rng(i*17+k*5)<.65)box(ww*.7,.28,.9,dark,-w/2+ww*(k+.5)+k*.12,hh+.12,side*d/2,g)}}for(const side of [-1,1])for(let k=0;k<2;k++){const hh=h*(.45+.4*rng(i*23+k+side*3));box(.7,hh,d/2-.4,stone,side*w/2,hh/2,(k-.5)*d/2,g)}if(b.kind==='hall'){for(let k=0;k<5;k++)box(1,1.5,.4,wood,-w/2+3+k*5,4.2,d/2+.45,g);box(w*.36,.35,d*.7,roof,-w*.18,8.1,0,g).rotation.z=.12}else if(b.kind==='church'){box(3,10,3,stone,-w/2+2,5,-d/2+2,g);cyl(1.9,2.3,2.3,roof,-w/2+2,11,-d/2+2,g,4);box(1.2,3,.6,wood,0,1.7,d/2+.35,g)}else{box(w*.7,.4,d*.42,roof,-w*.08,4.4,-d*.2,g).rotation.z=.23}for(let j=0;j<13;j++){const x=(rng(i*101+j*17)-.5)*(w+6),z=(rng(i*59+j*13)-.5)*(d+6);box(.5+rng(j+i)*1.2,.3+rng(j+8)*.7,.8,dark,x,.25,z,g).rotation.y=rng(j*5+i)*6}return g}buildings.forEach(ruin);
function tree(x,z,s,seed){cyl(.22*s,.27*s,2.8*s,wood,x,1.4*s,z);for(let i=0;i<3;i++){const o=new T.Mesh(new T.ConeGeometry((2.6-i*.45)*s,(4-i*.4)*s,7),leaves[Math.floor(rng(seed+i)*3)]);o.position.set(x,(3+i*1.7)*s,z);o.castShadow=true;scene.add(o)}}
for(let i=0;i<570;i++){const x=(rng(i*13+4)-.5)*940,z=(rng(i*19+9)-.5)*940;if(Math.hypot(x-55,z+45)<28)continue;if(buildings.some(b=>Math.abs(x-(b.x+b.w/2-500))<b.w/2+9&&Math.abs(z-(b.y+b.h/2-500))<b.h/2+9))continue;if(roads.some(p=>{let [a,b]=p,dx=b[0]-a[0],dz=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz)));return Math.hypot(x-a[0]-t*dx,z-a[1]-t*dz)<5}))continue;if(rng(i*7)<.52)tree(x,z,.65+rng(i*41)*1.05,i);else if(i%3===0){cyl(.4,.6,.7,dark,x,.35,z,scene,6)}}
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.43;controls.minPolarAngle=.28;controls.minDistance=18;controls.maxDistance=560;controls.target.set(55,0,-45);camera.position.set(180,150,185);controls.update();
const targets={well:[55,-45,45],church:[-70,-135,48],hall:[65,-135,58],wide:[25,-30,260]};let focus='well',tour=true,showNames=true,clock=new T.Clock();function goto(key){focus=key;tour=false;document.getElementById('tour').classList.remove('active');const [x,z,dist]=targets[key];controls.target.set(x,0,z);camera.position.set(x+dist*.9,dist*.8,z+dist);controls.update();document.getElementById('msg').textContent=key==='well'?'Poço ancestral • lote LH-bd45 • 10 × 10 m':key==='church'?'Igreja • 20 × 10 m':key==='hall'?'Prefeitura • 30 × 10 m':'Setor LH • Vila Inicial'}for(const key of Object.keys(targets))document.getElementById(key).onclick=()=>goto(key);document.getElementById('tour').onclick=()=>{tour=!tour;document.getElementById('tour').classList.toggle('active',tour)};document.getElementById('labels').onclick=e=>{showNames=!showNames;e.target.textContent='Nomes: '+(showNames?'sim':'não');document.getElementById('msg').hidden=!showNames};
renderer.domElement.addEventListener('pointerdown',()=>{tour=false;document.getElementById('tour').classList.remove('active')});const ray=new T.Raycaster(),mouse=new T.Vector2();renderer.domElement.addEventListener('click',e=>{mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(pick,true);if(hits.length){let obj=hits[0].object;while(obj&&!obj.userData.id)obj=obj.parent;if(obj?.userData?.id){document.getElementById('msg').textContent=obj.userData.name+' • '+obj.userData.w+' × '+obj.userData.h+' m'}}});function frame(){requestAnimationFrame(frame);const t=clock.getElapsedTime();if(tour){controls.target.lerp(new T.Vector3(35,0,-55),.012);const dist=145+18*Math.sin(t*.12);camera.position.set(35+Math.cos(t*.105)*dist,100+20*Math.sin(t*.13),-55+Math.sin(t*.105)*dist);camera.lookAt(controls.target)}else controls.update();renderer.render(scene,camera)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('loading').hidden=true;frame();
</script></body></html>
